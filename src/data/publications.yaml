- title: Basis Transformers for Multi-Task Tabular Regression
  authors: [Wei Min Loh, Jiaqi Shang, Pascal Poupart]
  venue: arXiv preprint
  year: 2025
  summary: >-
    A transformer for tables with heterogeneous columns, text features and missing values. Across
    34 OpenML-CTR23 tasks it lifts median R² by 0.338 with the lowest variance, using five times
    fewer parameters than the strongest baseline.
