- title: Basis Transformers for Multi-Task Tabular Regression
  authors: [Wei Min Loh, Jiaqi Shang, Pascal Poupart]
  venue: arXiv
  status: Preprint
  year: 2025
  topics: [tabular]
  summary: >-
    A transformer for real-world tables: text features, a varying number of columns, missing and
    noisy values. Across 34 OpenML-CTR23 regression tasks it improves median R² by 0.338 with the
    lowest variance of any method, using five times fewer parameters than the strongest baseline.
  abstract: |-
    Dealing with tabular data is challenging due to partial information, noise, and heterogeneous structure. Existing techniques often struggle to simultaneously address key aspects of tabular data such as textual information, a variable number of columns, and unseen data without metadata besides column names. We propose a novel architecture, basis transformers, specifically designed to tackle these challenges while respecting inherent invariances in tabular data, including hierarchical structure and the representation of numeric values. We evaluate our design on a multi-task tabular regression benchmark, achieving an improvement of 0.338 in the median R² score and the lowest standard deviation across 34 tasks from the OpenML-CTR23 benchmark. Furthermore, our model has five times fewer parameters than the best-performing baseline and surpasses pretrained large language model baselines – even when initialized from randomized weights.
