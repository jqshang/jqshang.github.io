- title: Learning to Represent Social Information in Multi-Agent Reinforcement Learning for Self-Organized Systems
  authors: [Jiaqi Shang, Evan Grzeszkiewicz-O’Neill, Hao Ji, Bingling Huang]
  venue: IDETC-CIE 2026
  status: Oral
  year: 2026
  topics: [multi-agent]
  summary: >-
    Should cooperating agents know who their teammates are? We treat agent identity as an explicit
    social signal in multi-agent reinforcement learning and compare ways to represent it; on a
    cooperative box-pushing assembly task, structured social information makes agents learn faster
    and perform better as a team.
  abstract: |-
    Self-organizing systems (SoS) have emerged as a promising paradigm for enabling scalable and adaptive coordination in complex engineering tasks. Recent advances in multi-agent reinforcement learning (MARL) provide a powerful methodology for learning decentralized policies. However, existing approaches lack a deep understanding of social interactions, limiting their ability to effectively utilize rich social information.

    This paper investigates how social learning can be systematically integrated into MARL by focusing on the representation of social information, particularly agent identity (ID). Prior studies have shown that team-level behaviors often evolve into distinct role specializations, suggesting that agent identity may play an important role in learning and coordination. However, how such information should be represented and incorporated into the learning process remains unclear. To address this, we conceptualize social capability as a spectrum and extend it by introducing agent identity as an explicit social signal. We further examine how different representation methods influence learning dynamics and team-level performance.

    Experiments are conducted on a cooperative box-pushing assembly task with collision avoidance, which requires complex coordination and long-term strategy formation. The results demonstrate that incorporating structured social information improves learning efficiency and task performance, while revealing key mechanisms of social learning in multi-agent systems. This work provides new insights into socially-aware MARL and contributes to the design of self-organizing systems for complex engineering applications.
  links: []
- title: "ERD: Extended RAW-Diffusion Framework for De-rendering sRGB Images"
  authors: [Jiaqi Shang, Yifan Qu, Jianbo Qi]
  venue: ISPRS 2026
  status: Oral
  year: 2026
  topics: [vision]
  summary: >-
    Recovering a camera's original RAW sensor data from an ordinary sRGB photo, without knowing
    which camera took it. We add ControlNet guidance to RAW-Diffusion so it generalizes to unseen
    sensors with no metadata, beating the baseline on Nikon and staying competitive on Canon, Leica,
    and Sony.
  abstract: |-
    Recovering RAW sensor measurements from sRGB images is a central problem in computational photography, as RAW data preserves the true scene radiance prior to the nonlinear transformations introduced by a camera’s Image Signal Processing (ISP) pipeline. However, ISPs vary across different camera brands and models, making inverse ISP reconstruction particularly challenging when the sensor characteristics are unknown. Existing approaches often rely on metadata, modifiable ISP, or camera-specific training, which limits their ability to generalize across unseen devices. In this paper, we investigate a diffusion-based inverse ISP framework designed for cross-sensor RAW reconstruction. Building upon the RAW-Diffusion model, we incorporate a ControlNet-guided architecture that provides structured conditioning to improve generalization without requiring metadata at inference time. Using the MIT-Adobe FiveK dataset, we evaluate seven camera models, which is sufficient to test cross-sensor robustness. Our results demonstrate that the proposed ControlNet-enhanced model enhances reconstruction accuracy on unseen sensors, outperforming the baseline RAW-Diffusion model on the Nikon dataset and achieving competitive performance on Canon, Leica, and Sony. These findings highlight the potential of guidance-based diffusion models for practical, camera-agnostic inverse ISP.
