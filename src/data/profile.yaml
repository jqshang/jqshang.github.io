# Bio. [[key|text]] marks a hover preview (see previews.yaml); __text__ underlines for emphasis.
bio:
  - >-
    My name is 尚嘉奇 (Jiaqi Shang), and I'm from [[baotou|Baotou]], Inner Mongolia, in northern China.
  - >-
    I'm a Master of Science in Applied Computing student at the [[uoft|University of Toronto]], where
    I work with [[krishnan|Prof. Rahul G. Krishnan]] on foundation models for tabular and causal
    data. I'm also a visiting graduate student at [[ucr|UC Riverside]] and a volunteer researcher at
    [[csuf|California State University, Fullerton]]. There I work with [[huang|Prof. Bingling Huang]] on multi-agent
    reinforcement learning, and with Prof. Huang and [[zhu|Prof. Yuanhang Zhu]] on agents that learn
    to swim through complex fluid flows.
  - >-
    Before that, I studied computer science and statistics at the [[waterloo|University of Waterloo]],
    and did research with [[poupart|Prof. Pascal Poupart]] at Waterloo and the [[vector|Vector Institute]].
    Together we developed [[basis|Basis Transformers]], a model that learns across many regression
    tasks on messy real-world tables, with text features, varying columns, and missing values.
  - >-
    I use AI in nearly everything I can think of, from my daily workflow to my software projects, and
    it keeps impressing me, all the more because it is getting better so quickly. On anything that
    comes down to memorization and pattern matching, today's models are already better than I am,
    and better than I ever expected. Where they still fall short is design, invention, creativity,
    and reasoning: __deciding what is worth building, and why__. That is where I want to focus.
  - >-
    It is also why I want to go deeper into research and into the essence of things: to spend my
    time on the creative part, to understand the theory underneath, and to feel the beauty where
    mathematics, computing, science, and the humanities meet. That doesn't mean leaving applications
    behind. I enjoy applied work, and I believe strength in theory and strength in practice grow
    together.
  - >-
    In short, I hope my work helps all of us, as humans, find a little more joy, live our lives more
    fully, and savour the time we have.
